{% extends "auth_base.html" %}
{% load widget_tweaks %}
{% block title %}Log in &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-cone-striped fs-1 text-primary"></i>
      <h1 class="h4 mt-2 mb-0">{{ SITE_NAME }}</h1>
      <p class="text-muted small">Warehouse, quarry &amp; fleet stock — costed to the job</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {% include "partials/_form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'accounts:password_reset' %}" class="small text-decoration-none">Forgot your password?</a>
    </div>
  </div>
</div>
{% endblock %}
