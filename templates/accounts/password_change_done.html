{% extends "base.html" %}
{% block title %}Password Changed &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm" style="max-width: 480px;">
  <div class="card-body text-center py-5">
    <i class="bi bi-check-circle-fill text-success fs-1 mb-3 d-block"></i>
    <h1 class="h5 mb-2">Password Changed</h1>
    <p class="text-muted mb-4">Your password has been updated successfully.</p>
    <a href="{% url 'accounts:profile' %}" class="btn btn-primary">Back to Profile</a>
  </div>
</div>
{% endblock %}
