{% extends "auth_base.html" %}
{% block title %}Password Reset Complete &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-body p-4 text-center">
    <i class="bi bi-check-circle-fill text-success fs-1"></i>
    <h1 class="h4 mt-2 mb-2">Password reset</h1>
    <p class="text-muted small mb-4">Your password has been set. You can now log in.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Log in</a>
  </div>
</div>
{% endblock %}
