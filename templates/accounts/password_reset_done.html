{% extends "auth_base.html" %}
{% block title %}Check Your Email &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-body p-4 text-center">
    <i class="bi bi-envelope-check fs-1 text-primary"></i>
    <h1 class="h4 mt-2 mb-2">Check your email</h1>
    <p class="text-muted small mb-4">
      If an account exists with that email address, we've sent a link to reset your password.
      It may take a few minutes to arrive.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary w-100">Back to login</a>
  </div>
</div>
{% endblock %}
