{% extends "base.html" %}
{% block title %}New User &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<nav style="--bs-breadcrumb-divider: '/';" aria-label="breadcrumb">
  <ol class="breadcrumb mb-1">
    <li class="breadcrumb-item"><a href="{% url 'accounts:user_list' %}">Users</a></li>
    <li class="breadcrumb-item active">New User</li>
  </ol>
</nav>
<h1 class="h4 mb-4">New User</h1>
<div class="card border-0 shadow-sm" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
      {% endif %}
      {% include "partials/_form_fields.html" %}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary px-4">Create User</button>
        <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
