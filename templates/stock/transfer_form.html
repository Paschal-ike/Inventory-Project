{% extends "base.html" %}
{% block title %}Transfer Stock &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<nav style="--bs-breadcrumb-divider: '/';" aria-label="breadcrumb">
  <ol class="breadcrumb mb-1">
    <li class="breadcrumb-item"><a href="{% url 'stock:store_ledger' store_pk=store.pk %}">{{ store.code }}</a></li>
    <li class="breadcrumb-item active">Transfer</li>
  </ol>
</nav>
<h1 class="h4 mb-4">Internal Transfer — from {{ store.name }}</h1>
<div class="card border-0 shadow-sm" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Item</label>
        <select name="item" class="form-select" required>
          {% for item in items %}
            <option value="{{ item.pk }}">{{ item.sku }} — {{ item.name }} ({{ item.unit_of_measure }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Quantity</label>
        <input type="number" step="0.001" name="quantity" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Destination store</label>
        <select name="destination_store" class="form-select" required>
          {% for s in destination_stores %}
            <option value="{{ s.pk }}">{{ s.code }} — {{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Reference</label>
        <input type="text" name="reference" class="form-control" placeholder="Transfer note number">
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary px-4">Transfer</button>
        <a href="{% url 'stock:store_ledger' store_pk=store.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
