{% extends "base.html" %}
{% block title %}New Item &middot; {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h4 mb-4">New Item</h1>
<div class="card border-0 shadow-sm" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">SKU</label>
        <input type="text" name="sku" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Category</label>
        <select name="category" class="form-select">
          {% for value, label in categories %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Unit of measure</label>
        <input type="text" name="unit_of_measure" class="form-control" placeholder="tonne, litre, piece" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Valuation method</label>
        <select name="valuation_method" class="form-select">
          {% for value, label in valuation_methods %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Reorder level</label>
        <input type="number" step="0.01" name="reorder_level" class="form-control" value="0">
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary px-4">Create Item</button>
        <a href="{% url 'items:item_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
